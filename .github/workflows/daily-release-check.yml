name: Daily Upstream Release Monitor & Publisher

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild and update packages even if release already exists'
        required: false
        type: boolean
        default: true
      specific_version:
        description: 'Specific tmux version to build (e.g. 3.8, leave empty for latest)'
        required: false
        type: string
        default: ''

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream for latest release
        id: upstream
        run: |
          if [ -n "${{ github.event.inputs.specific_version }}" ]; then
            TAG="v${{ github.event.inputs.specific_version }}"
            TAG="${TAG#vv}"
            VERSION="${TAG#v}"
            echo "latest_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "latest_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Selected specific version: ${VERSION} (${TAG})"
          else
            ./scripts/check-upstream.sh
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release already exists in current repository
        id: check_local
        run: |
          TARGET_TAG="${{ steps.upstream.outputs.latest_tag }}"
          FORCE="${{ github.event.inputs.force_build }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${FORCE}" ]; then
            FORCE="true"
          fi

          echo "Target tag: ${TARGET_TAG}"
          echo "Force build: ${FORCE}"

          if gh release view "${TARGET_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${FORCE}" = "true" ]; then
              echo "Release ${TARGET_TAG} already exists, but force_build is true. Rebuilding..."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release ${TARGET_TAG} already exists in ${{ github.repository }}. Skipping automated build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"

              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "### Upstream Status: Up to date" >> "$GITHUB_STEP_SUMMARY"
                echo "The latest upstream release is **${TARGET_TAG}**, which is already published in **${{ github.repository }}**." >> "$GITHUB_STEP_SUMMARY"
                echo "No new build was required." >> "$GITHUB_STEP_SUMMARY"
                echo "*(To force rebuild, run manually with **force_build** checked).*" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "New release detected! ${TARGET_TAG} is not yet published in ${{ github.repository }}. Proceeding with build..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages for all architectures (amd64 and arm64)
        if: steps.check_local.outputs.should_build == 'true'
        run: |
          TARGET_VER="${{ steps.upstream.outputs.latest_version }}"
          echo "Building universal .deb packages for tmux ${TARGET_VER} (amd64 and arm64)..."
          ./scripts/build-deb.sh --version "${TARGET_VER}" --arch all --out-dir dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test and verify packages
        if: steps.check_local.outputs.should_build == 'true'
        run: |
          ./scripts/test-deb.sh dist/*.deb

      - name: Generate consolidated SHA256SUMS
        if: steps.check_local.outputs.should_build == 'true'
        run: |
          cd dist
          sha256sum tmux_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publish or Update GitHub Release
        if: steps.check_local.outputs.should_build == 'true'
        run: |
          TARGET_TAG="${{ steps.upstream.outputs.latest_tag }}"
          TARGET_VER="${{ steps.upstream.outputs.latest_version }}"

          NOTES_FILE="$(mktemp)"
          echo "## tmux ${TARGET_VER} (.deb packages)" >> "${NOTES_FILE}"
          echo "" >> "${NOTES_FILE}"
          echo "Automated universal Debian / Ubuntu packages built from the official [tmux/tmux-builds](https://github.com/tmux/tmux-builds) release \`${TARGET_TAG}\`." >> "${NOTES_FILE}"
          echo "" >> "${NOTES_FILE}"
          echo "### Supported Architectures" >> "${NOTES_FILE}"
          echo "- **amd64** (\`x86_64\`)" >> "${NOTES_FILE}"
          echo "- **arm64** (\`aarch64\`)" >> "${NOTES_FILE}"
          echo "" >> "${NOTES_FILE}"
          echo "### Universal Distribution Compatibility" >> "${NOTES_FILE}"
          echo "These packages are statically compiled with musl-libc and packaged with \`xz\` compression for universal compatibility across:" >> "${NOTES_FILE}"
          echo "- **Debian**: 11 (Bullseye), 12 (Bookworm), 13 (Trixie), 14 (Forky), and Sid" >> "${NOTES_FILE}"
          echo "- **Ubuntu**: 22.04 LTS (Jammy), 24.04 LTS (Noble), 25.10 (Questing), 26.04 LTS (Resolute)" >> "${NOTES_FILE}"
          echo "" >> "${NOTES_FILE}"
          echo "### Installation" >> "${NOTES_FILE}"
          echo "\`\`\`bash" >> "${NOTES_FILE}"
          echo "sudo dpkg -i tmux_${TARGET_VER}-1_<arch>.deb" >> "${NOTES_FILE}"
          echo "\`\`\`" >> "${NOTES_FILE}"

          if gh release view "${TARGET_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TARGET_TAG} exists. Updating release notes and assets..."
            gh release edit "${TARGET_TAG}" --repo "${{ github.repository }}" --title "tmux ${TARGET_VER}" --notes-file "${NOTES_FILE}"
            gh release upload "${TARGET_TAG}" dist/* --repo "${{ github.repository }}" --clobber
          else
            echo "Creating GitHub Release ${TARGET_TAG}..."
            gh release create "${TARGET_TAG}" dist/* \
              --repo "${{ github.repository }}" \
              --title "tmux ${TARGET_VER}" \
              --notes-file "${NOTES_FILE}"
          fi
          rm -f "${NOTES_FILE}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write GitHub Step Summary
        if: steps.check_local.outputs.should_build == 'true'
        run: |
          TARGET_TAG="${{ steps.upstream.outputs.latest_tag }}"
          TARGET_VER="${{ steps.upstream.outputs.latest_version }}"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "### Release Published Successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** [${TARGET_TAG}](https://github.com/${{ github.repository }}/releases/tag/${TARGET_TAG})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **tmux Version:** \`${TARGET_VER}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Packages Built:**" >> "$GITHUB_STEP_SUMMARY"
            echo "  - \`dist/tmux_${TARGET_VER}-1_amd64.deb\`" >> "$GITHUB_STEP_SUMMARY"
            echo "  - \`dist/tmux_${TARGET_VER}-1_arm64.deb\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Checksums" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: steps.check_local.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tmux-deb-${{ steps.upstream.outputs.latest_version }}
          path: dist/*
